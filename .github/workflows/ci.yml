name: "CI"

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  # push 이벤트가 유실돼 배포가 안 나가는 일이 있었다(8/6 푸시는 워크플로가
  # 생성되지 않았다). 수동으로 같은 파이프라인을 다시 돌릴 수 있게 열어둔다.
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup Python"
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: "Install dependencies"
        run: pip install -r requirements.txt

      - name: "Ruff lint"
        run: ruff check .

      # .env 없이 도는 환경 — config가 로컬 SQLite 기본값으로 떨어진다.
      - name: "Pytest"
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup Node"
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: "Install dependencies"
        run: npm ci

      - name: "Lint"
        run: npm run lint

      - name: "Test"
        run: npm run test

      - name: "Build"
        run: npm run build

  # deploy job 을 두지 않는다.
  #
  # 포크 원본(btc-daily-web)에는 self-hosted 러너로 pull + rebuild 하는 job 이
  # 있었다. 그 러너(measly-btc-daily)는 btc-daily-web 저장소에 등록된 repo 스코프라
  # 여기서는 잡히지 않고, 계정이 User 라 org 레벨 러너도 없다 — 그대로 두면 push
  # 마다 deploy job 이 영영 대기한다. job 본문도 /home/measly/btc-daily-web 을
  # 가리켜서, 설령 잡히더라도 남의 프로젝트를 다시 배포한다.
  #
  # 그래서 이 저장소의 배포는 수동이다 — DEPLOY.md 7 절(git pull + docker compose
  # up -d --build). 나중에 ai-daily-web 용 러너를 붙이면 그때 job 을 되살리되,
  # 경로와 runs-on 라벨을 이 프로젝트 것으로 바꿔야 한다.
