# daily.onebitecoder.com — 두 카드뉴스 시리즈의 공용 인그레스
#
# 이 파일은 "호스트 시스템 nginx"(/etc/nginx)용이고, **이 저장소가 소유자다.**
# quantum-weekly-web 은 자기 vhost 파일을 들고 있지 않다 — 그쪽을 배포하면서 이
# 파일을 덮어쓰면 /ai 가 죽기 때문이다. `/quantum` 블록도 여기서 관리한다.
#
# 컨테이너 내부 nginx(각 저장소의 frontend/nginx.conf)와 역할이 다르다:
#   호스트 nginx  : TLS 종단 + 서브패스별 프록시 (8021 · 8023)  ← 이 파일
#   컨테이너 nginx: dist 정적 서빙 + 접두사 제거 후 backend:8000 + SPA fallback
#
# 설치 (최초 1회) — 인증서가 없는 상태로 :443 블록을 넣으면 nginx -t가 깨지므로 2단계로 올린다:
#
#   1) :80 블록만 담긴 임시 conf로 먼저 올린다 (아래 첫 server 블록만 복사)
#      sudo nginx -t && sudo systemctl reload nginx
#
#   2) 인증서 발급 (daily 전용 — 기존 공용 인증서에 --expand 하지 않는다.
#      SAN 목록을 잘못 넘기면 기존 도메인이 갱신에서 조용히 빠진다)
#      sudo certbot certonly --webroot -w /var/www/letsencrypt \
#           --cert-name daily.onebitecoder.com -d daily.onebitecoder.com
#
#   3) 이 파일 전체로 교체
#      sudo cp deploy/nginx/daily.onebitecoder.com.conf \
#              /etc/nginx/sites-available/daily.onebitecoder.com
#      sudo ln -sf /etc/nginx/sites-available/daily.onebitecoder.com \
#                  /etc/nginx/sites-enabled/daily.onebitecoder.com
#      sudo nginx -t && sudo systemctl reload nginx
#
# DNS는 Cloudflare 프록시(orange cloud) 뒤에 있다. HTTP-01 챌린지는 CF를 통과한다
# (같은 서버의 mempool.onebitebitcoin.com이 동일한 방식으로 발급받은 선례).

server {
    listen 80;
    listen [::]:80;
    server_name daily.onebitecoder.com;

    # certbot --webroot 챌린지. 리다이렉트보다 먼저 매치되어야 한다.
    location ~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        allow all;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name daily.onebitecoder.com;

    access_log /var/log/nginx/daily.onebitecoder.com.access.log;
    error_log /var/log/nginx/daily.onebitecoder.com.error.log;

    ssl_certificate /etc/letsencrypt/live/daily.onebitecoder.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daily.onebitecoder.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 발행 POST는 카드 10장 + Q&A가 통째로 들어가 기본 1M을 넘길 수 있다.
    client_max_body_size 10M;

    # 이 도메인에는 카드뉴스 시리즈가 둘 올라와 있다. 각 시리즈가 자기 서브패스
    # 아래를 통째로 소유한다 — 화면도 API 도 헬스체크도 그 밑이다. 도메인 루트는
    # 어느 시리즈의 것도 아니어서, 셋째 시리즈가 생기면 블록 하나만 더 붙이면 된다.
    #
    # 각 블록 안에서 경로를 더 나누지 않는 이유: 백엔드가 redirect_slashes=False라
    # 경로를 손대면 안 되고, SPA fallback도 컨테이너 nginx의 try_files 한 곳에만
    # 있어야 한다. 접두사를 떼는 일은 컨테이너 nginx가 한다.
    #
    # 접두사 location 은 파일 안의 순서와 무관하게 **가장 긴 것**이 이긴다.

    # 루트로 들어온 사람은 기본 시리즈로 보낸다.
    location = / {
        return 301 /ai/;
    }

    # ai-daily-web — 매일 발행
    location /ai {
        proxy_pass http://127.0.0.1:8021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }

    # quantum-weekly-web — 수집은 매일, 발행은 주 1회.
    # 저장소가 다르다(/Users/nsw/meeting_room/lab/quantum-weekly-web). 그쪽은 vhost
    # 파일을 들고 있지 않고 이 파일을 가리킨다 — 두 저장소가 각자 conf 를 들고
    # 있으면 한쪽을 배포하면서 다른 쪽을 지운다.
    location /quantum {
        proxy_pass http://127.0.0.1:8023;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }

    # ── 레거시 (전환 기간에만) ────────────────────────────────────────────
    # 2026-09-21 이전에는 ai-daily-web 의 API 가 루트에 있었다. 그때 공유된 링크의
    # og:image 가 `https://daily.onebitecoder.com/api/og/<날짜>/image.jpg` 를
    # 가리키므로, 카카오톡·텔레그램이 그 링크를 다시 긁을 때 404 가 나지 않도록
    # 당분간 살려 둔다. 새로 나가는 링크는 전부 `/ai/api` 다.
    #
    # 지우는 기준: access log 에서 루트 `/api` 요청이 사라지면 아래 두 블록과
    # ai-daily-web 의 frontend/nginx.conf 에 있는 같은 블록을 함께 지운다.
    #
    #   sudo awk '$7 ~ /^\/api\// {print $4, $7}' \
    #       /var/log/nginx/daily.onebitecoder.com.access.log | tail -20
    location /api {
        proxy_pass http://127.0.0.1:8021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }
}
